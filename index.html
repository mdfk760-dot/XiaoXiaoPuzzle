<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 瀏覽器分頁標題 -->
  <title>笑笑的益智遊戲</title>

  <!-- 搜尋引擎 / 一般網站描述 -->
  <meta
    name="description"
    content="為了不想看廣告而生的益智小遊戲。"
  >

  <!-- LINE / Discord / Facebook 分享預覽 -->
  <meta
    property="og:title"
    content="笑笑的益智遊戲"
  >

  <meta
    property="og:description"
    content="為了不想看廣告而生的益智小遊戲。"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://mdfk760-dot.github.io/XiaoXiaoPuzzle/"
  >


  <style>

    body {
      margin: 0;

      font-family:
        "Microsoft JhengHei",
        sans-serif;

      background: #0f172a;

      color: white;
    }


    .container {
      width: min(900px, 92%);

      margin: auto;

      padding: 40px 0;
    }


    h1 {
      text-align: center;

      margin-bottom: 40px;
    }


    .games {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(240px, 1fr)
        );

      gap: 20px;
    }


    .game-card {
      display: block;

      padding: 24px;

      border-radius: 16px;

      background: #1e293b;

      color: white;

      text-decoration: none;

      transition: 0.2s;
    }


    .game-card:hover {
      transform:
        translateY(-4px);

      background: #334155;
    }


    .game-card h2 {
      margin-top: 0;
    }


    .game-card p {
      color: #cbd5e1;

      line-height: 1.6;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>
      笑笑的益智遊戲
    </h1>


    <div class="games">


      <a
        class="game-card"
        href="./lights-out/"
      >

        <h2>
          Lights Out｜連線點燈
        </h2>

        <p>
          將目前圖案調整成與目標圖案相同。
        </p>

      </a>


      <a
        class="game-card"
        href="./sliding-puzzle/"
      >

        <h2>
          Sliding Puzzle｜滑動拼圖
        </h2>

        <p>
          將所有拼圖移回正確位置。
        </p>

      </a>


    </div>

  </div>

</body>

</html>
