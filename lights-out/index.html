<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>連線燈光益智遊戲</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #111827
        );

      color: white;
    }


    /* =========================
       主容器
    ========================= */

    .container {
      width: min(1000px, 94%);
      margin: auto;
      padding: 30px 0 50px;
    }


    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 32px;
    }


    .description {
      text-align: center;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 25px;
    }


    /* =========================
       上方控制區
    ========================= */

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 12px;
      flex-wrap: wrap;

      margin-bottom: 20px;
    }


    select,
    button {
      border: none;
      border-radius: 10px;

      padding: 11px 16px;

      font-size: 16px;
      font-family: inherit;

      cursor: pointer;
    }


    select {
      background: #1e293b;
      color: white;

      border: 1px solid #475569;
    }


    button {
      background: #334155;
      color: white;

      transition: 0.2s;
    }


    button:hover {
      background: #475569;
      transform: translateY(-1px);
    }


    button.primary {
      background: #2563eb;
    }


    button.primary:hover {
      background: #3b82f6;
    }


    button.hint {
      background: #7c3aed;
    }


    button.hint:hover {
      background: #8b5cf6;
    }


    /* =========================
       資訊列
    ========================= */

    .info-bar {
      display: flex;
      justify-content: center;

      gap: 30px;
      flex-wrap: wrap;

      margin-bottom: 22px;

      color: #cbd5e1;
    }


    .info-item {
      background: #1e293b;

      padding: 10px 16px;

      border-radius: 10px;
    }


    .info-value {
      color: #facc15;
      font-weight: bold;
    }


    /* =========================
       遊戲區
    ========================= */

    .game-area {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 20px;
    }


    .panel {
      background: rgba(30, 41, 59, 0.9);

      border-radius: 18px;

      padding: 20px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2);
    }


    .panel h2 {
      margin-top: 0;
      text-align: center;
      font-size: 20px;
    }


    .board-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
    }


    svg {
      width: 100%;
      height: 100%;

      display: block;

      background:
        radial-gradient(
          circle at center,
          #172033,
          #0f172a
        );

      border-radius: 14px;
    }


    /* =========================
       線
    ========================= */

    .line {
      stroke: #475569;
      stroke-width: 4;
      stroke-linecap: round;
    }


    /* =========================
       玩家節點
    ========================= */

    .node {
      fill: #334155;

      stroke: #94a3b8;
      stroke-width: 3;

      cursor: pointer;

      transition: 0.15s;
    }


    .node:hover {
      stroke: white;
      stroke-width: 4;
    }


    .node.on {
      fill: #facc15;

      stroke: #fef08a;

      filter:
        drop-shadow(
          0 0 10px #facc15
        );
    }


    /* =========================
       目標節點
    ========================= */

    .target-node {
      fill: #334155;

      stroke: #94a3b8;
      stroke-width: 3;
    }


    .target-node.on {
      fill: #22c55e;

      stroke: #bbf7d0;

      filter:
        drop-shadow(
          0 0 10px #22c55e
        );
    }


    /* =========================
       提示
    ========================= */

    .hint-node {
      stroke: #c084fc !important;
      stroke-width: 7 !important;

      filter:
        drop-shadow(
          0 0 14px #a855f7
        );
    }


    /* =========================
       訊息
    ========================= */

    #message {
      min-height: 38px;

      margin-top: 25px;

      text-align: center;

      font-size: 22px;
      font-weight: bold;

      color: #4ade80;
    }


    .rules {
      margin-top: 25px;

      padding: 18px 20px;

      border-radius: 14px;

      background: #1e293b;

      color: #cbd5e1;

      line-height: 1.8;
    }


    .rules strong {
      color: white;
    }


    /* =========================
       回到首頁
    ========================= */

    .home-button {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 1000;

      display: inline-block;

      padding: 10px 16px;

      border-radius: 10px;

      background: #334155;
      color: white;

      text-decoration: none;

      font-size: 15px;

      transition: 0.2s;
    }


    .home-button:hover {
      background: #475569;
      transform: translateY(-1px);
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 700px) {

      .container {
        width: 95%;
        padding-top: 70px;
      }


      h1 {
        font-size: 25px;
      }


      .game-area {
        grid-template-columns: 1fr;
      }


      .toolbar {
        gap: 8px;
      }


      select,
      button {
        font-size: 14px;
        padding: 10px 12px;
      }


      .info-bar {
        gap: 8px;
      }


      .info-item {
        font-size: 14px;
      }


      .home-button {
        top: 12px;
        left: 12px;

        padding: 9px 13px;

        font-size: 14px;
      }

    }

  </style>

</head>


<body>

  <a class="home-button" href="../">
    ← 回到首頁
  </a>


  <div class="container">

    <h1>
      連線燈光益智遊戲
    </h1>


    <div class="description">

      點擊節點時，

      <strong>
        自己＋所有直接相連的節點
      </strong>

      都會切換亮／暗。

      <br>

      請把右邊變成左邊的目標圖案。

    </div>


    <!-- =========================
         控制區
    ========================== -->

    <div class="toolbar">

      <select
        id="difficulty"
        onchange="changeDifficulty()"
      >

        <option
          value="easy"
          selected
        >
          簡單
        </option>

        <option value="normal">
          普通
        </option>

        <option value="hard">
          困難
        </option>

      </select>


      <button onclick="restartGame()">
        重新開始
      </button>


      <button
        class="hint"
        onclick="showHint()"
      >
        提示
      </button>


      <button
        class="primary"
        onclick="newGame()"
      >
        下一關
      </button>

    </div>


    <!-- =========================
         資訊列
    ========================== -->

    <div class="info-bar">

      <div class="info-item">

        目前步數：

        <span
          id="moveCount"
          class="info-value"
        >
          0
        </span>

      </div>


      <div class="info-item">

        最佳解：

        <span
          id="bestCount"
          class="info-value"
        >
          -
        </span>

      </div>


      <div class="info-item">

        節點數：

        <span
          id="nodeCount"
          class="info-value"
        >
          -
        </span>

      </div>

    </div>


    <!-- =========================
         遊戲板
    ========================== -->

    <div class="game-area">


      <!-- 目標 -->

      <div class="panel">

        <h2>
          目標圖案
        </h2>

        <div class="board-wrapper">

          <svg
            id="targetBoard"
            viewBox="0 0 400 400"
          >
          </svg>

        </div>

      </div>


      <!-- 玩家 -->

      <div class="panel">

        <h2>
          目前圖案
        </h2>

        <div class="board-wrapper">

          <svg
            id="gameBoard"
            viewBox="0 0 400 400"
          >
          </svg>

        </div>

      </div>


    </div>


    <div id="message"></div>


    <div class="rules">

      <strong>
        規則：
      </strong>

      每個點只能看成「按」或「不按」。

      同一個點按兩次，
      效果會互相抵消。

      <br>

      紫色外框代表提示建議按下的節點。

    </div>


  </div>


  <script>


    /* ==================================================
       版型資料
    ================================================== */


    const layouts = [


      /* ---------- 版型 1 ---------- */

      {

        nodes: [

          { x: 200, y: 45 },

          { x: 90, y: 135 },

          { x: 310, y: 135 },

          { x: 120, y: 260 },

          { x: 280, y: 260 },

          { x: 200, y: 350 }

        ],

        connections: [

          [0, 1],

          [0, 2],

          [1, 2],

          [1, 3],

          [2, 4],

          [3, 4],

          [3, 5],

          [4, 5]

        ]

      },


      /* ---------- 版型 2 ---------- */

      {

        nodes: [

          { x: 200, y: 40 },

          { x: 85, y: 115 },

          { x: 315, y: 115 },

          { x: 70, y: 270 },

          { x: 200, y: 210 },

          { x: 330, y: 270 },

          { x: 200, y: 355 }

        ],

        connections: [

          [0, 1],

          [0, 2],

          [1, 3],

          [1, 4],

          [2, 4],

          [2, 5],

          [3, 4],

          [4, 5],

          [3, 6],

          [4, 6],

          [5, 6]

        ]

      },


      /* ---------- 版型 3 ---------- */

      {

        nodes: [

          { x: 70, y: 90 },

          { x: 200, y: 70 },

          { x: 330, y: 90 },

          { x: 110, y: 210 },

          { x: 290, y: 210 },

          { x: 80, y: 330 },

          { x: 200, y: 300 },

          { x: 320, y: 330 }

        ],

        connections: [

          [0, 1],

          [1, 2],

          [0, 3],

          [1, 3],

          [1, 4],

          [2, 4],

          [3, 4],

          [3, 5],

          [3, 6],

          [4, 6],

          [4, 7],

          [5, 6],

          [6, 7]

        ]

      },


      /* ---------- 版型 4 ---------- */

      {

        nodes: [

          { x: 200, y: 45 },

          { x: 95, y: 100 },

          { x: 305, y: 100 },

          { x: 60, y: 215 },

          { x: 200, y: 180 },

          { x: 340, y: 215 },

          { x: 110, y: 330 },

          { x: 290, y: 330 },

          { x: 200, y: 365 }

        ],

        connections: [

          [0, 1],

          [0, 2],

          [1, 3],

          [1, 4],

          [2, 4],

          [2, 5],

          [3, 4],

          [4, 5],

          [3, 6],

          [4, 6],

          [4, 7],

          [5, 7],

          [6, 8],

          [7, 8]

        ]

      },


      /* ---------- 版型 5 ---------- */

      {

        nodes: [

          { x: 200, y: 50 },

          { x: 100, y: 110 },

          { x: 300, y: 110 },

          { x: 70, y: 230 },

          { x: 200, y: 200 },

          { x: 330, y: 230 },

          { x: 120, y: 340 },

          { x: 280, y: 340 }

        ],

        connections: [

          [0, 1],

          [0, 2],

          [1, 3],

          [1, 4],

          [2, 4],

          [2, 5],

          [3, 4],

          [4, 5],

          [3, 6],

          [4, 6],

          [4, 7],

          [5, 7],

          [6, 7]

        ]

      }

    ];



    /* ==================================================
       遊戲變數
    ================================================== */


    let nodes = [];

    let connections = [];


    let currentState = [];

    let startState = [];

    let targetState = [];


    let moveCount = 0;


    let bestSolution = [];


    let hintIndex = null;


    let gameFinished = false;



    /* ==================================================
       套用一次按鈕效果
    ================================================== */


    function applyPress(state, index) {


      state[index] =
        !state[index];


      connections.forEach(connection => {


        const a = connection[0];

        const b = connection[1];


        if (a === index) {

          state[b] =
            !state[b];

        }


        else if (b === index) {

          state[a] =
            !state[a];

        }


      });

    }



    /* ==================================================
       比較兩個狀態
    ================================================== */


    function statesEqual(a, b) {


      if (a.length !== b.length) {

        return false;

      }


      for (
        let i = 0;
        i < a.length;
        i++
      ) {


        if (a[i] !== b[i]) {

          return false;

        }

      }


      return true;

    }



    /* ==================================================
       找最佳解
    ================================================== */


    function findBestSolution(
      fromState,
      toState
    ) {


      const n = nodes.length;


      const total =
        Math.pow(2, n);


      let best = null;


      for (
        let mask = 0;
        mask < total;
        mask++
      ) {


        const testState =
          [...fromState];


        const presses = [];


        for (
          let i = 0;
          i < n;
          i++
        ) {


          if (
            mask &
            (1 << i)
          ) {


            applyPress(
              testState,
              i
            );


            presses.push(i);

          }

        }


        if (
          statesEqual(
            testState,
            toState
          )
        ) {


          if (
            best === null ||
            presses.length <
            best.length
          ) {


            best = presses;

          }

        }

      }


      return best || [];

    }



    /* ==================================================
       難度
    ================================================== */


    function getDifficultyRange() {


      const difficulty =
        document
          .getElementById(
            "difficulty"
          )
          .value;


      if (
        difficulty === "easy"
      ) {

        return {
          min: 1,
          max: 2
        };

      }


      if (
        difficulty === "normal"
      ) {

        return {
          min: 3,
          max: 4
        };

      }


      return {
        min: 5,
        max: 9
      };

    }



    /* ==================================================
       選擇版型
    ================================================== */


    function chooseLayout() {


      const difficulty =
        document
          .getElementById(
            "difficulty"
          )
          .value;


      let availableLayouts;


      if (
        difficulty === "easy"
      ) {


        availableLayouts =
          layouts.filter(
            layout =>
              layout.nodes.length <= 6
          );

      }


      else if (
        difficulty === "normal"
      ) {


        availableLayouts =
          layouts.filter(
            layout =>
              layout.nodes.length <= 8
          );

      }


      else {


        availableLayouts =
          layouts;

      }


      const layout =
        availableLayouts[
          Math.floor(
            Math.random() *
            availableLayouts.length
          )
        ];


      nodes =
        layout.nodes.map(
          node => ({ ...node })
        );


      connections =
        layout.connections.map(
          connection => [
            ...connection
          ]
        );

    }



    /* ==================================================
       隨機可達狀態
    ================================================== */


    function randomReachableState() {


      const state =
        new Array(
          nodes.length
        ).fill(false);


      const presses =
        Math.floor(
          Math.random() *
          nodes.length
        ) + 1;


      for (
        let i = 0;
        i < presses;
        i++
      ) {


        const index =
          Math.floor(
            Math.random() *
            nodes.length
          );


        applyPress(
          state,
          index
        );

      }


      return state;

    }



    /* ==================================================
       產生關卡
    ================================================== */


    function generatePuzzle() {


      chooseLayout();


      const range =
        getDifficultyRange();


      let attempts = 0;


      while (
        attempts < 500
      ) {


        attempts++;


        startState =
          randomReachableState();


        targetState =
          [...startState];


        const pressAmount =
          Math.floor(
            Math.random() *
            nodes.length
          ) + 1;


        for (
          let i = 0;
          i < pressAmount;
          i++
        ) {


          const index =
            Math.floor(
              Math.random() *
              nodes.length
            );


          applyPress(
            targetState,
            index
          );

        }


        if (
          statesEqual(
            startState,
            targetState
          )
        ) {

          continue;

        }


        const solution =
          findBestSolution(
            startState,
            targetState
          );


        if (
          solution.length >=
          range.min
          &&
          solution.length <=
          Math.min(
            range.max,
            nodes.length
          )
        ) {


          bestSolution =
            solution;


          break;

        }

      }


      if (
        bestSolution.length === 0
      ) {


        bestSolution =
          findBestSolution(
            startState,
            targetState
          );

      }


      currentState =
        [...startState];


      moveCount = 0;

      hintIndex = null;

      gameFinished = false;

    }



    /* ==================================================
       畫連線
    ================================================== */


    function drawConnections(svg) {


      connections.forEach(
        connection => {


          const startNode =
            nodes[
              connection[0]
            ];


          const endNode =
            nodes[
              connection[1]
            ];


          const line =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );


          line.setAttribute(
            "x1",
            startNode.x
          );


          line.setAttribute(
            "y1",
            startNode.y
          );


          line.setAttribute(
            "x2",
            endNode.x
          );


          line.setAttribute(
            "y2",
            endNode.y
          );


          line.setAttribute(
            "class",
            "line"
          );


          svg.appendChild(line);

        }
      );

    }



    /* ==================================================
       畫目標
    ================================================== */


    function drawTarget() {


      const svg =
        document.getElementById(
          "targetBoard"
        );


      svg.innerHTML = "";


      drawConnections(svg);


      nodes.forEach(
        (node, index) => {


          const circle =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle"
            );


          circle.setAttribute(
            "cx",
            node.x
          );


          circle.setAttribute(
            "cy",
            node.y
          );


          circle.setAttribute(
            "r",
            22
          );


          circle.setAttribute(

            "class",

            targetState[index]

              ? "target-node on"

              : "target-node"

          );


          svg.appendChild(circle);

        }
      );

    }



    /* ==================================================
       畫目前棋盤
    ================================================== */


    function drawGame() {


      const svg =
        document.getElementById(
          "gameBoard"
        );


      svg.innerHTML = "";


      drawConnections(svg);


      nodes.forEach(
        (node, index) => {


          const circle =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle"
            );


          circle.setAttribute(
            "cx",
            node.x
          );


          circle.setAttribute(
            "cy",
            node.y
          );


          circle.setAttribute(
            "r",
            22
          );


          let className =
            currentState[index]

              ? "node on"

              : "node";


          if (
            hintIndex === index
          ) {


            className +=
              " hint-node";

          }


          circle.setAttribute(
            "class",
            className
          );


          circle.addEventListener(
            "click",
            function () {


              clickNode(index);

            }
          );


          svg.appendChild(circle);

        }
      );

    }



    /* ==================================================
       玩家點擊
    ================================================== */


    function clickNode(index) {


      if (
        gameFinished
      ) {

        return;

      }


      hintIndex = null;


      applyPress(
        currentState,
        index
      );


      moveCount++;


      drawGame();


      updateInfo();


      checkWin();

    }



    /* ==================================================
       更新資訊
    ================================================== */


    function updateInfo() {


      document
        .getElementById(
          "moveCount"
        )
        .textContent =
        moveCount;


      document
        .getElementById(
          "bestCount"
        )
        .textContent =
        bestSolution.length;


      document
        .getElementById(
          "nodeCount"
        )
        .textContent =
        nodes.length;

    }



    /* ==================================================
       檢查過關
    ================================================== */


    function checkWin() {


      if (
        !statesEqual(
          currentState,
          targetState
        )
      ) {

        return;

      }


      gameFinished = true;


      const message =
        document.getElementById(
          "message"
        );


      if (
        moveCount ===
        bestSolution.length
      ) {


        message.textContent =
          "完美！你用了最佳步數完成這一關！";

      }


      else {


        message.textContent =
          `完成！你用了 ${moveCount} 步，最佳解是 ${bestSolution.length} 步。`;

      }

    }



    /* ==================================================
       重新開始
    ================================================== */


    function restartGame() {


      currentState =
        [...startState];


      moveCount = 0;


      hintIndex = null;


      gameFinished = false;


      document
        .getElementById(
          "message"
        )
        .textContent = "";


      drawGame();


      updateInfo();

    }



    /* ==================================================
       新關卡
    ================================================== */


    function newGame() {


      bestSolution = [];


      generatePuzzle();


      document
        .getElementById(
          "message"
        )
        .textContent = "";


      drawTarget();


      drawGame();


      updateInfo();

    }



    /* ==================================================
       更改難度
    ================================================== */


    function changeDifficulty() {


      newGame();

    }



    /* ==================================================
       提示
    ================================================== */


    function showHint() {


      if (
        gameFinished
      ) {

        return;

      }


      const solution =
        findBestSolution(
          currentState,
          targetState
        );


      if (
        solution.length === 0
      ) {


        document
          .getElementById(
            "message"
          )
          .textContent =
          "目前已經是正確答案。";


        return;

      }


      hintIndex =
        solution[0];


      document
        .getElementById(
          "message"
        )
        .textContent =
        "紫色外框的節點可以先按。";


      drawGame();

    }



    /* ==================================================
       初始化
    ================================================== */


    newGame();


  </script>

</body>

</html>
