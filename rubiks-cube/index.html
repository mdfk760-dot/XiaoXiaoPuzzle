<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rubik's Cube｜魔術方塊</title>

  <meta
    name="description"
    content="3D 3×3 魔術方塊益智遊戲。"
  >

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      min-height: 100%;

      font-family:
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background: #0f172a;

      color: white;
    }


    body {
      min-height: 100vh;
    }


    /* ================================
       回首頁
    ================================= */

    .home-button {
      position: fixed;

      top: 20px;
      left: 20px;

      z-index: 1000;

      display: inline-block;

      padding: 10px 16px;

      border-radius: 10px;

      background: #334155;

      color: white;

      text-decoration: none;

      font-size: 15px;

      transition: 0.2s;
    }


    .home-button:hover {
      background: #475569;

      transform: translateY(-1px);
    }


    /* ================================
       主體
    ================================= */

    .container {
      width: min(900px, 94%);

      margin: auto;

      padding: 32px 0 50px;
    }


    h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 32px;
    }


    .description {
      margin-bottom: 18px;

      text-align: center;

      color: #94a3b8;

      font-size: 15px;

      line-height: 1.7;
    }


    /* ================================
       上方按鈕
    ================================= */

    .toolbar {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 14px;
    }


    button {
      border: none;

      min-height: 42px;

      padding: 10px 16px;

      border-radius: 10px;

      background: #334155;

      color: white;

      font-family: inherit;

      font-size: 15px;

      cursor: pointer;

      transition: 0.15s;
    }


    button:hover:not(:disabled) {
      background: #475569;
    }


    button:active:not(:disabled) {
      transform: scale(0.97);
    }


    button:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }


    button.primary {
      background: #2563eb;
    }


    button.primary:hover:not(:disabled) {
      background: #3b82f6;
    }


    /* ================================
       資訊列
    ================================= */

    .info-bar {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 8px;

      margin-bottom: 14px;
    }


    .info-item {
      min-width: 0;

      padding: 10px 5px;

      border-radius: 10px;

      background: #1e293b;

      color: #cbd5e1;

      text-align: center;

      white-space: nowrap;
    }


    .info-value {
      color: #facc15;

      font-weight: bold;
    }


    /* ================================
       3D 區域
    ================================= */

    .cube-panel {
      overflow: hidden;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #1e293b,
          #111827
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.06);
    }


    #cube-container {
      position: relative;

      width: 100%;

      height: 540px;

      touch-action: none;

      user-select: none;

      -webkit-user-select: none;
    }


    #cube-container canvas {
      display: block;

      width: 100%;

      height: 100%;

      touch-action: none;
    }


    /* ================================
       操作提示
    ================================= */

    .gesture-help {
      position: absolute;

      left: 50%;
      bottom: 14px;

      transform: translateX(-50%);

      display: flex;

      gap: 8px;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      width: max-content;

      max-width: calc(100% - 20px);

      pointer-events: none;
    }


    .gesture-chip {
      padding: 7px 11px;

      border-radius: 20px;

      background:
        rgba(15, 23, 42, 0.78);

      color: #cbd5e1;

      font-size: 12px;

      white-space: nowrap;

      backdrop-filter: blur(5px);
    }


    /* ================================
       打亂公式
    ================================= */

    .scramble-box {
      margin-top: 14px;

      padding: 12px 14px;

      border-radius: 12px;

      background: #1e293b;

      color: #cbd5e1;

      line-height: 1.7;

      text-align: center;

      word-break: break-word;
    }


    .scramble-title {
      color: #94a3b8;
    }


    #scrambleText {
      color: white;

      font-weight: bold;
    }


    /* ================================
       訊息
    ================================= */

    #message {
      min-height: 30px;

      margin-top: 15px;

      color: #4ade80;

      text-align: center;

      font-size: 18px;

      font-weight: bold;
    }


    /* ================================
       規則
    ================================= */

    .rules {
      margin-top: 16px;

      padding: 16px 18px;

      border-radius: 14px;

      background: #1e293b;

      color: #cbd5e1;

      line-height: 1.9;
    }


    .rules strong {
      color: white;
    }


    /* ================================
       手機版
    ================================= */

    @media (max-width: 700px) {

      .container {
        width: 96%;

        padding-top: 72px;
      }


      .home-button {
        top: 12px;
        left: 12px;

        padding: 9px 13px;

        font-size: 14px;
      }


      h1 {
        font-size: 24px;
      }


      .description {
        margin-bottom: 14px;

        font-size: 13px;
      }


      button {
        padding: 9px 12px;

        font-size: 14px;
      }


      .info-bar {
        gap: 5px;
      }


      .info-item {
        padding: 8px 3px;

        font-size: 12px;
      }


      .info-value {
        font-size: 14px;
      }


      #cube-container {
        height: 430px;
      }


      .gesture-help {
        bottom: 9px;

        gap: 5px;
      }


      .gesture-chip {
        padding: 6px 9px;

        font-size: 11px;
      }


      .scramble-box {
        font-size: 13px;
      }


      .rules {
        padding: 13px;

        font-size: 13px;
      }

    }


    @media (max-width: 400px) {

      #cube-container {
        height: 390px;
      }

    }

  </style>

</head>


<body>


  <a
    href="../"
    class="home-button"
  >
    ← 回到首頁
  </a>


  <div class="container">


    <h1>
      Rubik's Cube｜魔術方塊
    </h1>


    <div class="description">
      直接拖曳魔方旋轉各層，將六個面恢復成各自相同的顏色。
    </div>


    <!-- ================================
         上方功能
    ================================= -->

    <div class="toolbar">

      <button
        id="scrambleButton"
        class="primary"
        type="button"
      >
        隨機打亂
      </button>


      <button
        id="resetButton"
        type="button"
      >
        重置
      </button>


      <button
        id="resetViewButton"
        type="button"
      >
        重置視角
      </button>

    </div>


    <!-- ================================
         資訊
    ================================= -->

    <div class="info-bar">

      <div class="info-item">

        步數：

        <span
          id="moveCount"
          class="info-value"
        >
          0
        </span>

      </div>


      <div class="info-item">

        時間：

        <span
          id="timer"
          class="info-value"
        >
          00:00
        </span>

      </div>


      <div class="info-item">

        狀態：

        <span
          id="statusText"
          class="info-value"
        >
          準備
        </span>

      </div>

    </div>


    <!-- ================================
         魔術方塊
    ================================= -->

    <div class="cube-panel">

      <div id="cube-container">

        <div class="gesture-help">

          <div class="gesture-chip">
            魔方上拖曳：旋轉該層
          </div>

          <div class="gesture-chip">
            空白處拖曳：旋轉視角
          </div>

        </div>

      </div>

    </div>


    <!-- ================================
         打亂公式
    ================================= -->

    <div class="scramble-box">

      <span class="scramble-title">
        打亂公式：
      </span>

      <span id="scrambleText">
        -
      </span>

    </div>


    <div id="message"></div>


    <!-- ================================
         規則
    ================================= -->

    <div class="rules">

      <strong>
        遊戲規則：
      </strong>

      將魔術方塊六個面恢復成各自相同的顏色。

      <br>

      在魔方表面按住並拖曳，
      即可旋轉對應的橫列或直欄。

      <br>

      在魔方外的空白區域拖曳，
      可以自由旋轉觀看整顆魔方。

      <br>

      可自由從任何角度觀看魔方，
      改變視角不計入步數。

      <br>

      每次實際旋轉一層算 1 步。

    </div>


  </div>


  <script type="module">

    import * as THREE
      from "three";


    import {
      OrbitControls
    }
    from "three/addons/controls/OrbitControls.js";



    /* ==================================================
       HTML
    ================================================== */

    const container =
      document.getElementById(
        "cube-container"
      );


    const moveCountElement =
      document.getElementById(
        "moveCount"
      );


    const timerElement =
      document.getElementById(
        "timer"
      );


    const statusElement =
      document.getElementById(
        "statusText"
      );


    const messageElement =
      document.getElementById(
        "message"
      );


    const scrambleTextElement =
      document.getElementById(
        "scrambleText"
      );


    const scrambleButton =
      document.getElementById(
        "scrambleButton"
      );


    const resetButton =
      document.getElementById(
        "resetButton"
      );


    const resetViewButton =
      document.getElementById(
        "resetViewButton"
      );



    /* ==================================================
       Three.js
    ================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        40,
        1,
        0.1,
        100
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    container.prepend(
      renderer.domElement
    );



    /* ==================================================
       相機
    ================================================== */

    camera.position.set(
      6,
      5,
      7
    );


    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.08;


    controls.enablePan =
      false;


    /*
      不設定 minPolarAngle /
      maxPolarAngle。

      因此視角可以自由上下翻轉。
    */


    controls.minDistance =
      5.2;


    controls.maxDistance =
      14;


    controls.target.set(
      0,
      0,
      0
    );


    controls.update();



    /* ==================================================
       燈光
    ================================================== */

    scene.add(

      new THREE.AmbientLight(
        0xffffff,
        2
      )

    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        2.2
      );


    keyLight.position.set(
      5,
      8,
      7
    );


    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        1.2
      );


    fillLight.position.set(
      -6,
      -3,
      -5
    );


    scene.add(
      fillLight
    );



    /* ==================================================
       魔方
    ================================================== */

    const cubeRoot =
      new THREE.Group();


    scene.add(
      cubeRoot
    );


    const cubies = [];


    const SPACING =
      1.03;


    const CUBIE_SIZE =
      0.94;



    const COLOR = {

      white:
        0xf8fafc,

      yellow:
        0xfacc15,

      green:
        0x22c55e,

      blue:
        0x2563eb,

      red:
        0xef4444,

      orange:
        0xf97316,

      inner:
        0x111827

    };



    /* ==================================================
       材質
    ================================================== */

    function createMaterial(
      color
    ) {

      return new THREE.MeshStandardMaterial({

        color,

        roughness: 0.43,

        metalness: 0.03

      });

    }



    function createCubieMaterials(
      x,
      y,
      z
    ) {

      /*
        BoxGeometry 材質順序：

        +X = 右
        -X = 左
        +Y = 上
        -Y = 下
        +Z = 前
        -Z = 後
      */

      return [

        createMaterial(
          x === 1
            ? COLOR.red
            : COLOR.inner
        ),

        createMaterial(
          x === -1
            ? COLOR.orange
            : COLOR.inner
        ),

        createMaterial(
          y === 1
            ? COLOR.white
            : COLOR.inner
        ),

        createMaterial(
          y === -1
            ? COLOR.yellow
            : COLOR.inner
        ),

        createMaterial(
          z === 1
            ? COLOR.green
            : COLOR.inner
        ),

        createMaterial(
          z === -1
            ? COLOR.blue
            : COLOR.inner
        )

      ];

    }



    /* ==================================================
       建立 27 顆方塊
    ================================================== */

    function createCube3D() {

      cubies.length =
        0;


      while (
        cubeRoot.children.length
      ) {

        const object =
          cubeRoot.children[0];


        cubeRoot.remove(
          object
        );

      }


      const geometry =
        new THREE.BoxGeometry(
          CUBIE_SIZE,
          CUBIE_SIZE,
          CUBIE_SIZE
        );


      for (
        let x = -1;
        x <= 1;
        x++
      ) {

        for (
          let y = -1;
          y <= 1;
          y++
        ) {

          for (
            let z = -1;
            z <= 1;
            z++
          ) {

            const cubie =
              new THREE.Mesh(

                geometry,

                createCubieMaterials(
                  x,
                  y,
                  z
                )

              );


            cubie.position.set(

              x * SPACING,

              y * SPACING,

              z * SPACING

            );


            cubie.userData.coord = {

              x,
              y,
              z

            };


            const edges =
              new THREE.LineSegments(

                new THREE.EdgesGeometry(
                  geometry
                ),

                new THREE.LineBasicMaterial({
                  color: 0x020617
                })

              );


            cubie.add(
              edges
            );


            cubeRoot.add(
              cubie
            );


            cubies.push(
              cubie
            );

          }

        }

      }

    }



    /* ==================================================
       貼紙邏輯
    ================================================== */

    let stickers = [];



    function createSolvedStickerState() {

      stickers = [];


      /* U */

      for (
        let x = -1;
        x <= 1;
        x++
      ) {

        for (
          let z = -1;
          z <= 1;
          z++
        ) {

          stickers.push({

            x,
            y: 1,
            z,

            nx: 0,
            ny: 1,
            nz: 0,

            color: "W"

          });

        }

      }


      /* D */

      for (
        let x = -1;
        x <= 1;
        x++
      ) {

        for (
          let z = -1;
          z <= 1;
          z++
        ) {

          stickers.push({

            x,
            y: -1,
            z,

            nx: 0,
            ny: -1,
            nz: 0,

            color: "Y"

          });

        }

      }


      /* F */

      for (
        let x = -1;
        x <= 1;
        x++
      ) {

        for (
          let y = -1;
          y <= 1;
          y++
        ) {

          stickers.push({

            x,
            y,
            z: 1,

            nx: 0,
            ny: 0,
            nz: 1,

            color: "G"

          });

        }

      }


      /* B */

      for (
        let x = -1;
        x <= 1;
        x++
      ) {

        for (
          let y = -1;
          y <= 1;
          y++
        ) {

          stickers.push({

            x,
            y,
            z: -1,

            nx: 0,
            ny: 0,
            nz: -1,

            color: "B"

          });

        }

      }


      /* L */

      for (
        let y = -1;
        y <= 1;
        y++
      ) {

        for (
          let z = -1;
          z <= 1;
          z++
        ) {

          stickers.push({

            x: -1,
            y,
            z,

            nx: -1,
            ny: 0,
            nz: 0,

            color: "O"

          });

        }

      }


      /* R */

      for (
        let y = -1;
        y <= 1;
        y++
      ) {

        for (
          let z = -1;
          z <= 1;
          z++
        ) {

          stickers.push({

            x: 1,
            y,
            z,

            nx: 1,
            ny: 0,
            nz: 0,

            color: "R"

          });

        }

      }

    }



    /* ==================================================
       旋轉向量
    ================================================== */

    function rotateVector(
      x,
      y,
      z,
      axis,
      direction
    ) {

      if (
        axis === "x"
      ) {

        if (
          direction === 1
        ) {

          return {
            x,
            y: -z,
            z: y
          };

        }


        return {
          x,
          y: z,
          z: -y
        };

      }


      if (
        axis === "y"
      ) {

        if (
          direction === 1
        ) {

          return {
            x: z,
            y,
            z: -x
          };

        }


        return {
          x: -z,
          y,
          z: x
        };

      }


      if (
        axis === "z"
      ) {

        if (
          direction === 1
        ) {

          return {
            x: -y,
            y: x,
            z
          };

        }


        return {
          x: y,
          y: -x,
          z
        };

      }

    }



    /* ==================================================
       更新邏輯狀態

       axis = x / y / z
       layer = -1 / 0 / 1
       direction = +1 / -1
    ================================================== */

    function applySliceToStickers(
      axis,
      layer,
      direction
    ) {

      stickers.forEach(
        sticker => {

          if (
            sticker[axis] !==
            layer
          ) {

            return;

          }


          const position =
            rotateVector(

              sticker.x,
              sticker.y,
              sticker.z,

              axis,
              direction

            );


          sticker.x =
            position.x;

          sticker.y =
            position.y;

          sticker.z =
            position.z;


          const normal =
            rotateVector(

              sticker.nx,
              sticker.ny,
              sticker.nz,

              axis,
              direction

            );


          sticker.nx =
            normal.x;

          sticker.ny =
            normal.y;

          sticker.nz =
            normal.z;

        }
      );

    }



    /* ==================================================
       判斷完成
    ================================================== */

    function getStickerFace(
      sticker
    ) {

      if (
        sticker.ny === 1
      ) {

        return "U";

      }


      if (
        sticker.ny === -1
      ) {

        return "D";

      }


      if (
        sticker.nx === 1
      ) {

        return "R";

      }


      if (
        sticker.nx === -1
      ) {

        return "L";

      }


      if (
        sticker.nz === 1
      ) {

        return "F";

      }


      return "B";

    }



    function isSolved() {

      const faces = [
        "U",
        "D",
        "L",
        "R",
        "F",
        "B"
      ];


      return faces.every(
        face => {

          const faceStickers =
            stickers.filter(
              sticker =>
                getStickerFace(
                  sticker
                ) === face
            );


          if (
            faceStickers.length !==
            9
          ) {

            return false;

          }


          const color =
            faceStickers[0].color;


          return faceStickers.every(
            sticker =>
              sticker.color ===
              color
          );

        }
      );

    }



    /* ==================================================
       旋轉 3D 某一層
    ================================================== */

    let isAnimating =
      false;


    const TURN_DURATION =
      220;



    function rotateLayer3D(
      axis,
      layer,
      direction,
      animated = true
    ) {

      return new Promise(
        resolve => {

          const selected =
            cubies.filter(
              cubie =>
                cubie.userData.coord[
                  axis
                ] === layer
            );


          const turnGroup =
            new THREE.Group();


          cubeRoot.add(
            turnGroup
          );


          selected.forEach(
            cubie => {

              turnGroup.attach(
                cubie
              );

            }
          );


          const targetAngle =
            direction *
            Math.PI /
            2;


          const finish =
            () => {

              turnGroup.rotation[
                axis
              ] =
                targetAngle;


              turnGroup.updateMatrixWorld(
                true
              );


              selected.forEach(
                cubie => {

                  cubeRoot.attach(
                    cubie
                  );


                  const old =
                    cubie.userData.coord;


                  const next =
                    rotateVector(

                      old.x,
                      old.y,
                      old.z,

                      axis,
                      direction

                    );


                  cubie.userData.coord = {

                    x:
                      Math.round(
                        next.x
                      ),

                    y:
                      Math.round(
                        next.y
                      ),

                    z:
                      Math.round(
                        next.z
                      )

                  };


                  cubie.position.set(

                    cubie.userData.coord.x
                    * SPACING,

                    cubie.userData.coord.y
                    * SPACING,

                    cubie.userData.coord.z
                    * SPACING

                  );


                  /*
                    四元數只需正規化。

                    orientation 本身必須保留，
                    因為貼紙也跟著小方塊旋轉。
                  */

                  cubie.quaternion.normalize();

                }
              );


              cubeRoot.remove(
                turnGroup
              );


              resolve();

            };


          if (
            !animated
          ) {

            finish();

            return;

          }


          const startedAt =
            performance.now();


          function animateTurn(
            now
          ) {

            const progress =
              Math.min(

                (
                  now -
                  startedAt
                )

                /

                TURN_DURATION,

                1
              );


            const eased =

              progress < 0.5

                ?

                2 *
                progress *
                progress

                :

                1 -

                Math.pow(
                  -2 *
                  progress +
                  2,
                  2
                )

                / 2;


            turnGroup.rotation[
              axis
            ] =
              targetAngle *
              eased;


            if (
              progress <
              1
            ) {

              requestAnimationFrame(
                animateTurn
              );

            }

            else {

              finish();

            }

          }


          requestAnimationFrame(
            animateTurn
          );

        }
      );

    }



    /* ==================================================
       遊戲資訊
    ================================================== */

    let moveCount =
      0;


    let gameStarted =
      false;


    let gameCompleted =
      false;


    let startTime =
      null;


    let timerInterval =
      null;



    function updateInfo() {

      moveCountElement.textContent =
        moveCount;

    }



    function startTimer() {

      if (
        gameStarted
      ) {

        return;

      }


      gameStarted =
        true;


      startTime =
        Date.now();


      timerInterval =
        setInterval(
          updateTimer,
          250
        );


      updateTimer();

    }



    function updateTimer() {

      if (
        !startTime
      ) {

        return;

      }


      const totalSeconds =
        Math.floor(

          (
            Date.now() -
            startTime
          )

          / 1000

        );


      const minutes =
        Math.floor(
          totalSeconds /
          60
        );


      const seconds =
        totalSeconds %
        60;


      timerElement.textContent =

        String(
          minutes
        ).padStart(
          2,
          "0"
        )

        +

        ":"

        +

        String(
          seconds
        ).padStart(
          2,
          "0"
        );

    }



    function stopTimer() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );


        timerInterval =
          null;

      }

    }



    function resetTimer() {

      stopTimer();


      gameStarted =
        false;


      startTime =
        null;


      timerElement.textContent =
        "00:00";

    }



    /* ==================================================
       玩家旋轉一層
    ================================================== */

    async function playerSliceMove(
      axis,
      layer,
      direction
    ) {

      if (
        isAnimating
      ) {

        return;

      }


      isAnimating =
        true;


      if (
        gameCompleted
      ) {

        gameCompleted =
          false;


        messageElement.textContent =
          "";


        statusElement.textContent =
          "遊戲中";

      }


      startTimer();


      applySliceToStickers(
        axis,
        layer,
        direction
      );


      await rotateLayer3D(
        axis,
        layer,
        direction,
        true
      );


      moveCount++;


      updateInfo();


      if (
        isSolved()
      ) {

        gameCompleted =
          true;


        stopTimer();


        statusElement.textContent =
          "完成";


        messageElement.textContent =
          `完成！共使用 ${moveCount} 步。`;

      }

      else {

        statusElement.textContent =
          "遊戲中";

      }


      isAnimating =
        false;

    }



    /* ==================================================
       Raycaster
    ================================================== */

    const raycaster =
      new THREE.Raycaster();


    const pointerNDC =
      new THREE.Vector2();



    function updatePointerNDC(
      event
    ) {

      const rect =
        renderer
          .domElement
          .getBoundingClientRect();


      pointerNDC.x =

        (
          (
            event.clientX -
            rect.left
          )

          / rect.width
        )

        * 2
        - 1;


      pointerNDC.y =

        -(

          (
            event.clientY -
            rect.top
          )

          / rect.height

        )

        * 2
        + 1;

    }



    function getIntersection(
      event
    ) {

      updatePointerNDC(
        event
      );


      raycaster.setFromCamera(
        pointerNDC,
        camera
      );


      const intersections =
        raycaster.intersectObjects(
          cubies,
          false
        );


      if (
        intersections.length ===
        0
      ) {

        return null;

      }


      return intersections[0];

    }



    /* ==================================================
       將世界向量轉為螢幕向量
    ================================================== */

    function projectWorldDirection(
      origin,
      direction
    ) {

      const rect =
        renderer
          .domElement
          .getBoundingClientRect();


      const p1 =
        origin
          .clone()
          .project(
            camera
          );


      const p2 =
        origin
          .clone()
          .add(
            direction
          )
          .project(
            camera
          );


      return new THREE.Vector2(

        (
          p2.x -
          p1.x
        )

        *
        rect.width
        / 2,


        -(

          p2.y -
          p1.y

        )

        *
        rect.height
        / 2

      );

    }



    /* ==================================================
       將面法向量吸附到 X/Y/Z 軸
    ================================================== */

    function snapAxisVector(
      vector
    ) {

      const absX =
        Math.abs(
          vector.x
        );


      const absY =
        Math.abs(
          vector.y
        );


      const absZ =
        Math.abs(
          vector.z
        );


      if (
        absX >= absY &&
        absX >= absZ
      ) {

        return new THREE.Vector3(

          Math.sign(
            vector.x
          ),

          0,

          0

        );

      }


      if (
        absY >= absX &&
        absY >= absZ
      ) {

        return new THREE.Vector3(

          0,

          Math.sign(
            vector.y
          ),

          0

        );

      }


      return new THREE.Vector3(

        0,

        0,

        Math.sign(
          vector.z
        )

      );

    }



    /* ==================================================
       找出該面的兩個可拖曳方向
    ================================================== */

    function getTangentAxes(
      normal
    ) {

      const axes = [

        new THREE.Vector3(
          1,
          0,
          0
        ),

        new THREE.Vector3(
          0,
          1,
          0
        ),

        new THREE.Vector3(
          0,
          0,
          1
        )

      ];


      return axes.filter(
        axis =>

          Math.abs(
            axis.dot(
              normal
            )
          )

          < 0.5
      );

    }



    /* ==================================================
       拖曳手勢
    ================================================== */

    let cubeGesture =
      null;


    const DRAG_THRESHOLD =
      22;



    function onPointerDown(
      event
    ) {

      /*
        旋轉動畫中禁止再抓魔方。
      */

      const hit =
        getIntersection(
          event
        );


      /*
        沒有點到魔方。

        不攔截事件，
        交給 OrbitControls，
        因此會旋轉觀看視角。
      */

      if (
        !hit
      ) {

        cubeGesture =
          null;

        return;

      }


      /*
        點到魔方時，
        這次手勢由我們自己處理。
      */

      event.preventDefault();

      event.stopPropagation();


      if (
        isAnimating
      ) {

        return;

      }


      controls.enabled =
        false;


      renderer.domElement.setPointerCapture(
        event.pointerId
      );


      /*
        取得碰到的面的法向量。
      */

      const normalMatrix =
        new THREE.Matrix3()
          .getNormalMatrix(
            hit.object.matrixWorld
          );


      const worldNormal =
        hit.face.normal
          .clone()
          .applyMatrix3(
            normalMatrix
          )
          .normalize();


      const snappedNormal =
        snapAxisVector(
          worldNormal
        );


      cubeGesture = {

        pointerId:
          event.pointerId,

        startX:
          event.clientX,

        startY:
          event.clientY,

        cubie:
          hit.object,

        hitPoint:
          hit.point.clone(),

        normal:
          snappedNormal,

        triggered:
          false

      };

    }



    async function onPointerMove(
      event
    ) {

      if (
        !cubeGesture
      ) {

        return;

      }


      if (
        event.pointerId !==
        cubeGesture.pointerId
      ) {

        return;

      }


      event.preventDefault();

      event.stopPropagation();


      if (
        cubeGesture.triggered
      ) {

        return;

      }


      const dx =
        event.clientX -
        cubeGesture.startX;


      const dy =
        event.clientY -
        cubeGesture.startY;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      if (
        distance <
        DRAG_THRESHOLD
      ) {

        return;

      }


      cubeGesture.triggered =
        true;


      /*
        使用者在螢幕上的拖曳方向。
      */

      const screenDrag =
        new THREE.Vector2(
          dx,
          dy
        )
          .normalize();


      /*
        找出目前這個面上的
        兩個世界座標方向。
      */

      const tangents =
        getTangentAxes(
          cubeGesture.normal
        );


      let bestAxis =
        null;


      let bestDot =
        0;


      tangents.forEach(
        axis => {

          const projected =
            projectWorldDirection(

              cubeGesture.hitPoint,

              axis

            );


          if (
            projected.lengthSq() <
            0.0001
          ) {

            return;

          }


          projected.normalize();


          const dot =
            screenDrag.dot(
              projected
            );


          if (
            Math.abs(
              dot
            )
            >
            Math.abs(
              bestDot
            )
          ) {

            bestDot =
              dot;


            bestAxis =
              axis.clone();

          }

        }
      );


      if (
        !bestAxis
      ) {

        endCubeGesture();

        return;

      }


      /*
        如果使用者拖的是反方向，
        世界方向也反轉。
      */

      if (
        bestDot <
        0
      ) {

        bestAxis.multiplyScalar(
          -1
        );

      }


      /*
        旋轉軸：

        面的法向量 × 拖曳方向

        例如：

        正面向右拖
        Z × X = Y

        因此會旋轉橫列。
      */

      const rotationVector =
        new THREE.Vector3()
          .crossVectors(

            cubeGesture.normal,

            bestAxis

          );


      const snappedRotation =
        snapAxisVector(
          rotationVector
        );


      let axis;

      let direction;


      if (
        snappedRotation.x !==
        0
      ) {

        axis =
          "x";


        direction =
          snappedRotation.x;

      }


      else if (
        snappedRotation.y !==
        0
      ) {

        axis =
          "y";


        direction =
          snappedRotation.y;

      }


      else {

        axis =
          "z";


        direction =
          snappedRotation.z;

      }


      /*
        點到哪一顆小方塊，
        就旋轉它所在的那一層。

        因此中間層也可以拖。
      */

      const layer =
        cubeGesture
          .cubie
          .userData
          .coord[
            axis
          ];


      /*
        先保存資料，
        再結束手勢。
      */

      const move = {

        axis,
        layer,
        direction

      };


      endCubeGesture(
        false
      );


      await playerSliceMove(

        move.axis,

        move.layer,

        move.direction

      );


      controls.enabled =
        true;

    }



    function onPointerUp(
      event
    ) {

      if (
        !cubeGesture
      ) {

        return;

      }


      if (
        event.pointerId !==
        cubeGesture.pointerId
      ) {

        return;

      }


      event.preventDefault();

      event.stopPropagation();


      endCubeGesture();

    }



    function onPointerCancel(
      event
    ) {

      if (
        cubeGesture &&
        event.pointerId ===
        cubeGesture.pointerId
      ) {

        endCubeGesture();

      }

    }



    function endCubeGesture(
      enableControls = true
    ) {

      if (
        cubeGesture
      ) {

        try {

          renderer
            .domElement
            .releasePointerCapture(
              cubeGesture.pointerId
            );

        }

        catch (
          error
        ) {
          /*
            Pointer capture 已釋放時
            可以忽略。
          */
        }

      }


      cubeGesture =
        null;


      if (
        enableControls
      ) {

        controls.enabled =
          true;

      }

    }



    /*
      capture = true 很重要。

      先判斷是否點到魔方，
      再決定要不要讓 OrbitControls
      接手。
    */

    renderer.domElement.addEventListener(
      "pointerdown",
      onPointerDown,
      true
    );


    renderer.domElement.addEventListener(
      "pointermove",
      onPointerMove,
      true
    );


    renderer.domElement.addEventListener(
      "pointerup",
      onPointerUp,
      true
    );


    renderer.domElement.addEventListener(
      "pointercancel",
      onPointerCancel,
      true
    );



    /* ==================================================
       標準打亂
    ================================================== */

    const scrambleMoves = [

      {
        name: "R",
        axis: "x",
        layer: 1,
        direction: -1
      },

      {
        name: "L",
        axis: "x",
        layer: -1,
        direction: 1
      },

      {
        name: "U",
        axis: "y",
        layer: 1,
        direction: -1
      },

      {
        name: "D",
        axis: "y",
        layer: -1,
        direction: 1
      },

      {
        name: "F",
        axis: "z",
        layer: 1,
        direction: -1
      },

      {
        name: "B",
        axis: "z",
        layer: -1,
        direction: 1
      }

    ];



    function generateScramble(
      length = 25
    ) {

      const result = [];


      let previousName =
        null;


      for (
        let i = 0;
        i < length;
        i++
      ) {

        let move;


        do {

          move =
            scrambleMoves[
              Math.floor(
                Math.random()
                *
                scrambleMoves.length
              )
            ];

        }

        while (
          move.name ===
          previousName
        );


        previousName =
          move.name;


        const prime =
          Math.random() <
          0.5;


        result.push({

          name:
            move.name,

          axis:
            move.axis,

          layer:
            move.layer,

          direction:

            prime

              ?

              -move.direction

              :

              move.direction,

          prime

        });

      }


      return result;

    }



    /* ==================================================
       打亂
    ================================================== */

    async function scrambleCube() {

      if (
        isAnimating
      ) {

        return;

      }


      isAnimating =
        true;


      scrambleButton.disabled =
        true;


      resetButton.disabled =
        true;


      createCube3D();


      createSolvedStickerState();


      const scramble =
        generateScramble(
          25
        );


      for (
        const move of scramble
      ) {

        applySliceToStickers(

          move.axis,

          move.layer,

          move.direction

        );


        await rotateLayer3D(

          move.axis,

          move.layer,

          move.direction,

          false

        );

      }


      scrambleTextElement.textContent =
        scramble
          .map(
            move =>

              move.prime

                ?

                `${move.name}′`

                :

                move.name
          )
          .join(
            " "
          );


      moveCount =
        0;


      updateInfo();


      resetTimer();


      gameCompleted =
        false;


      statusElement.textContent =
        "遊戲中";


      messageElement.textContent =
        "";


      isAnimating =
        false;


      scrambleButton.disabled =
        false;


      resetButton.disabled =
        false;

    }



    /* ==================================================
       重置
    ================================================== */

    function resetCube() {

      if (
        isAnimating
      ) {

        return;

      }


      createCube3D();


      createSolvedStickerState();


      moveCount =
        0;


      updateInfo();


      resetTimer();


      gameCompleted =
        false;


      scrambleTextElement.textContent =
        "-";


      statusElement.textContent =
        "完成狀態";


      messageElement.textContent =
        "已重置魔術方塊。";

    }



    /* ==================================================
       重置視角
    ================================================== */

    function resetView() {

      camera.position.set(
        6,
        5,
        7
      );


      controls.target.set(
        0,
        0,
        0
      );


      controls.update();

    }



    /* ==================================================
       按鈕
    ================================================== */

    scrambleButton.addEventListener(
      "click",
      scrambleCube
    );


    resetButton.addEventListener(
      "click",
      resetCube
    );


    resetViewButton.addEventListener(
      "click",
      resetView
    );



    /* ==================================================
       Resize
    ================================================== */

    function resizeRenderer() {

      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      renderer.setSize(
        width,
        height,
        false
      );


      camera.aspect =
        width /
        height;


      camera.updateProjectionMatrix();

    }


    window.addEventListener(
      "resize",
      resizeRenderer
    );



    /* ==================================================
       Render
    ================================================== */

    function render() {

      requestAnimationFrame(
        render
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }



    /* ==================================================
       初始化
    ================================================== */

    createCube3D();


    createSolvedStickerState();


    resizeRenderer();


    render();


    /*
      進入遊戲後直接產生亂序。
    */

    scrambleCube();

  </script>

</body>
